<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0f0f13"/>

  <!-- Purple accent line top -->
  <rect x="0" y="0" width="1200" height="6" fill="#7C3AED"/>

  <!-- Brain icon (simplified, centered-left) -->
  <g transform="translate(340, 315)">
    <!-- Left hemisphere -->
    <path d="M-10,-80 C-60,-80 -100,-50 -105,-10 C-110,20 -95,45 -75,58 C-70,62 -68,70 -70,80 L-10,80 L-10,-80 Z"
      fill="#7C3AED" opacity="0.9"/>
    <!-- Right hemisphere -->
    <path d="M10,-80 C60,-80 100,-50 105,-10 C110,20 95,45 75,58 C70,62 68,70 70,80 L10,80 L10,-80 Z"
      fill="#9F67FF" opacity="0.85"/>
    <!-- Center line -->
    <rect x="-4" y="-80" width="8" height="160" fill="#0f0f13"/>
    <!-- Left detail lines -->
    <path d="M-20,-40 C-50,-35 -65,-15 -60,10" stroke="#0f0f13" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M-25,10 C-55,15 -65,35 -58,55" stroke="#0f0f13" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Right detail lines -->
    <path d="M20,-40 C50,-35 65,-15 60,10" stroke="#0f0f13" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M25,10 C55,15 65,35 58,55" stroke="#0f0f13" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- AURA text -->
  <text x="490" y="290" font-family="Arial, Helvetica, sans-serif" font-size="110" font-weight="900" fill="white" letter-spacing="-2">AURA</text>

  <!-- Brain text -->
  <text x="494" y="385" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="400" fill="#9F67FF" letter-spacing="8">Brain</text>

  <!-- Tagline -->
  <text x="494" y="450" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#6b7280" letter-spacing="1">Tu base de conocimiento inteligente</text>
</svg>
