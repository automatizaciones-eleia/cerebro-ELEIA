<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120">
  <defs>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-soft2">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="120" fill="#060818" rx="8"/>

  <!-- AURA text with glow -->
  <text
    x="48"
    y="84"
    font-family="Arial, Helvetica, sans-serif"
    font-size="74"
    font-weight="900"
    letter-spacing="6"
    fill="#c4b5fd"
    filter="url(#glow2)"
  >AURA</text>

  <!-- Brain text -->
  <text
    x="320"
    y="84"
    font-family="Arial, Helvetica, sans-serif"
    font-size="54"
    font-weight="300"
    letter-spacing="2"
    fill="#a78bfa"
    filter="url(#glow-soft2)"
  >Brain</text>
</svg>
